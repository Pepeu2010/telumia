name: Publicar pacotes Telumia para Android TV e Windows

on:
  workflow_dispatch:
    inputs:
      tv_ref:
        description: Branch ou commit do cliente Android TV
        required: false
        default: codex/telumia-brand-theme
        type: string
      desktop_version:
        description: Versão Desktop publicada; vazio seleciona a release publicada mais recente
        required: false
        type: string
      mode:
        description: Compilar e guardar como artefato, ou publicar no repositório principal
        required: true
        default: publish
        type: choice
        options:
          - publish
          - build-only
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/platform-release.yml

permissions:
  contents: write

concurrency:
  group: telumia-platform-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Android TV APKs + Windows PC MSI
    runs-on: ubuntu-latest
    env:
      TV_REF: ${{ github.event.inputs.tv_ref || 'codex/telumia-brand-theme' }}
      DESKTOP_VERSION_INPUT: ${{ github.event.inputs.desktop_version || '' }}
      RELEASE_MODE: ${{ github.event.inputs.mode || 'publish' }}

    steps:
      - name: Check out the main Telumia repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fetch the Android TV source without initializing submodules
        shell: bash
        run: |
          set -euo pipefail
          git init repos/tv
          git -C repos/tv remote add origin https://github.com/Pepeu2010/telumia-tv.git
          if [[ "${TV_REF}" =~ ^[a-f0-9]{40}$ ]]; then
            git -C repos/tv fetch --depth=1 --no-tags origin "${TV_REF}"
          else
            git -C repos/tv fetch --depth=1 --no-tags origin "refs/heads/${TV_REF}"
          fi
          git -C repos/tv checkout --detach FETCH_HEAD
          git -C repos/tv lfs install --local
          git -C repos/tv lfs pull origin

      - name: Select the Windows PC source release
        id: desktop_source
        shell: bash
        run: |
          set -euo pipefail
          desktop_api='https://api.github.com/repos/Pepeu2010/telumia-desktop/releases'
          requested="${DESKTOP_VERSION_INPUT#v}"
          if [[ -n "${requested}" ]]; then
            if [[ ! "${requested}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$ ]]; then
              echo "Invalid Desktop version: ${DESKTOP_VERSION_INPUT}" >&2
              exit 1
            fi
            desktop_tag="v${requested}"
            curl --fail --silent --show-error --location "${desktop_api}/tags/${desktop_tag}" \
              --output "${RUNNER_TEMP}/telumia-desktop-release.json"
          else
            curl --fail --silent --show-error --location "${desktop_api}?per_page=100" \
              --output "${RUNNER_TEMP}/telumia-desktop-releases.json"
            desktop_release_json="$(jq -c '[.[] | select(.draft == false)][0] // empty' "${RUNNER_TEMP}/telumia-desktop-releases.json")"
            if [[ -z "${desktop_release_json}" ]]; then
              echo 'The Desktop repository has no published release to package.' >&2
              exit 1
            fi
            printf '%s\n' "${desktop_release_json}" > "${RUNNER_TEMP}/telumia-desktop-release.json"
            desktop_tag="$(jq -r '.tag_name' "${RUNNER_TEMP}/telumia-desktop-release.json")"
          fi

          desktop_release="${RUNNER_TEMP}/telumia-desktop-release.json"
          if [[ "$(jq -r '.draft' "${desktop_release}")" != 'false' ]]; then
            echo "Desktop ${desktop_tag} is a draft and cannot be packaged." >&2
            exit 1
          fi
          manifest_asset="$(jq -c '[.assets[] | select(.name == "release-manifest.json")] | if length == 1 then .[0] else empty end' "${desktop_release}")"
          if [[ -z "${manifest_asset}" ]]; then
            echo "Desktop ${desktop_tag} must provide exactly one release manifest." >&2
            exit 1
          fi
          manifest_path="${RUNNER_TEMP}/telumia-desktop-source-manifest.json"
          curl --fail --silent --show-error --location \
            "$(jq -r '.browser_download_url' <<<"${manifest_asset}")" --output "${manifest_path}"
          desktop_source_sha="$(jq -r '.sourceCommits.desktop // empty' "${manifest_path}")"
          if [[ ! "${desktop_source_sha}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Desktop ${desktop_tag} has no valid source commit in its manifest." >&2
            exit 1
          fi
          {
            echo "desktop_tag=${desktop_tag}"
            echo "desktop_source_sha=${desktop_source_sha}"
            echo "desktop_release_url=$(jq -r '.html_url' "${desktop_release}")"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate versions and avoid replacing a release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != 'refs/heads/main' ]]; then
            echo 'Run this workflow from the main branch so the release tag points to the main Telumia repository.' >&2
            exit 1
          fi
          source_version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' repos/tv/app/build.gradle.kts | head -n 1)"
          source_version_code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*$/\1/p' repos/tv/app/build.gradle.kts | head -n 1)"
          if [[ ! "${source_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$ || ! "${source_version_code}" =~ ^[0-9]+$ ]]; then
            echo "Could not read a valid Android versionName and versionCode from the selected source." >&2
            exit 1
          fi

          tv_sha="$(git -C repos/tv rev-parse HEAD)"
          desktop_sha="${{ steps.desktop_source.outputs.desktop_source_sha }}"
          desktop_tag="${{ steps.desktop_source.outputs.desktop_tag }}"
          release_list="${RUNNER_TEMP}/telumia-releases.json"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --output "${release_list}"

          published="$(jq -c '[.[] | select(.draft == false) | select(any(.assets[]; .name == "release-manifest.json"))][0] // empty' "${release_list}")"
          published_version=''
          published_version_code=''
          published_tv_sha=''
          published_desktop_sha=''
          published_desktop_tag=''
          if [[ -n "${published}" ]]; then
            published_tag="$(jq -r '.tag_name' <<<"${published}")"
            published_apk_count="$(jq '[.assets[] | select(.name | endswith(".apk"))] | length' <<<"${published}")"
            published_msi_count="$(jq '[.assets[] | select(.name | endswith(".msi"))] | length' <<<"${published}")"
            published_zip_count="$(jq '[.assets[] | select(.name | endswith(".zip"))] | length' <<<"${published}")"
            published_manifest_count="$(jq '[.assets[] | select(.name == "release-manifest.json")] | length' <<<"${published}")"
            published_sums_count="$(jq '[.assets[] | select(.name == "SHA256SUMS.txt")] | length' <<<"${published}")"
            if (( published_apk_count != 5 || published_msi_count != 1 || published_zip_count != 2 || \
                  published_manifest_count != 1 || published_sums_count != 1 )); then
              echo "The latest published release ${published_tag} is missing one or more required packages." >&2
              exit 1
            fi
            published_manifest_asset="$(jq -c '[.assets[] | select(.name == "release-manifest.json")][0]' <<<"${published}")"
            published_manifest_path="${RUNNER_TEMP}/telumia-latest-release-manifest.json"
            curl --fail --silent --show-error --location \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/octet-stream' \
              "$(jq -r '.url' <<<"${published_manifest_asset}")" --output "${published_manifest_path}"
            published_version="$(jq -r '.distributions.android.versionName // empty' "${published_manifest_path}")"
            published_version_code="$(jq -r '.distributions.android.versionCode // empty' "${published_manifest_path}")"
            published_tv_sha="$(jq -r '.sourceCommits.tv // empty' "${published_manifest_path}")"
            published_desktop_sha="$(jq -r '.sourceCommits.desktop // empty' "${published_manifest_path}")"
            published_desktop_tag="$(jq -r '.distributions.windows.sourceReleaseTag // empty' "${published_manifest_path}")"
            if [[ -z "${published_version}" || ! "${published_version_code}" =~ ^[0-9]+$ || \
                  ! "${published_tv_sha}" =~ ^[a-f0-9]{40}$ || ! "${published_desktop_sha}" =~ ^[a-f0-9]{40}$ || \
                  -z "${published_desktop_tag}" ]]; then
              echo "The latest combined release ${published_tag} has an incomplete source/version manifest." >&2
              exit 1
            fi
          fi

          if [[ -n "${published}" && "${tv_sha}" == "${published_tv_sha}" && \
                "${desktop_sha}" == "${published_desktop_sha}" && "${desktop_tag}" == "${published_desktop_tag}" && \
                "${RELEASE_MODE}" != 'build-only' ]]; then
            echo "The published release ${published_tag} already contains the selected TV and Windows sources."
            echo "action=skip" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          version_args=(--source-version "${source_version}" --source-code "${source_version_code}")
          if [[ -n "${published_version}" ]]; then
            version_args+=(--published-version "${published_version}" --published-code "${published_version_code}")
          fi
          python3 scripts/resolve_telumia_release_version.py "${version_args[@]}" >> "${GITHUB_OUTPUT}"
          version="$(sed -n 's/^version=//p' "${GITHUB_OUTPUT}" | tail -n 1)"
          version_code="$(sed -n 's/^version_code=//p' "${GITHUB_OUTPUT}" | tail -n 1)"
          tag="v${version}"
          prerelease=false
          if [[ "${version}" == *-* || "${desktop_tag}" == *-* ]]; then
            prerelease=true
          fi

          release_json="${RUNNER_TEMP}/telumia-existing-release.json"
          status="$(curl --silent --show-error --output "${release_json}" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
          if [[ "${status}" == '200' && "$(jq -r '.draft' "${release_json}")" == 'false' ]]; then
            echo "The generated tag ${tag} is already published; refusing to replace its files." >&2
            exit 1
          fi
          if [[ "${status}" != '200' && "${status}" != '404' ]]; then
            echo "Could not inspect the main repository release (HTTP ${status})." >&2
            cat "${release_json}" >&2
            exit 1
          fi

          matching_count="$(jq --arg tag "${tag}" '[.[] | select(.tag_name == $tag)] | length' "${release_list}")"
          if (( matching_count > 1 )); then
            echo "Multiple drafts or releases use ${tag}; inspect them before continuing." >&2
            exit 1
          fi
          if (( matching_count == 1 )); then
            draft="$(jq -c --arg tag "${tag}" '[.[] | select(.tag_name == $tag)][0]' "${release_list}")"
            if [[ "$(jq -r '.draft' <<<"${draft}")" != 'true' ]]; then
              echo "GitHub lists ${tag}, but the tag lookup returned 404; refusing to create a duplicate release." >&2
              exit 1
            fi
            apk_count="$(jq '[.assets[] | select(.name | endswith(".apk"))] | length' <<<"${draft}")"
            msi_count="$(jq '[.assets[] | select(.name | endswith(".msi"))] | length' <<<"${draft}")"
            zip_count="$(jq '[.assets[] | select(.name | endswith(".zip"))] | length' <<<"${draft}")"
            manifest_count="$(jq '[.assets[] | select(.name == "release-manifest.json")] | length' <<<"${draft}")"
            sums_count="$(jq '[.assets[] | select(.name == "SHA256SUMS.txt")] | length' <<<"${draft}")"
            if (( apk_count != 5 || msi_count != 1 || zip_count != 2 || manifest_count != 1 || sums_count != 1 )); then
              echo "The draft ${tag} is incomplete; preserve it for inspection instead of replacing it." >&2
              exit 1
            fi
            {
              echo "version=${version}"
              echo "version_code=${version_code}"
              echo "tag=${tag}"
              echo "prerelease=${prerelease}"
              echo "tv_sha=${tv_sha}"
              echo "desktop_sha=${desktop_sha}"
              if [[ "${RELEASE_MODE}" == 'publish' ]]; then
                echo "action=resume_draft"
                echo "draft_id=$(jq -r '.id' <<<"${draft}")"
              else
                echo 'action=build'
              fi
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          {
            echo "version=${version}"
            echo "version_code=${version_code}"
            echo "tag=${tag}"
            echo "prerelease=${prerelease}"
            echo "tv_sha=${tv_sha}"
            echo "desktop_sha=${desktop_sha}"
            echo "action=build"
          } >> "${GITHUB_OUTPUT}"

      - name: Explain that this version is already published
        if: steps.release.outputs.action == 'skip'
        run: echo "This Android version already has its combined APK + MSI release in ${GITHUB_REPOSITORY}."

      - name: Set up Java
        if: steps.release.outputs.action == 'build'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.release.outputs.action == 'build'
        uses: gradle/actions/setup-gradle@v6

      - name: Configure official backend for the production APK
        if: steps.release.outputs.action == 'build'
        shell: bash
        env:
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import urlparse

          url = os.environ.get("NUVIO_SUPABASE_URL", "").strip()
          key = os.environ.get("NUVIO_SUPABASE_ANON_KEY", "").strip()
          parsed = urlparse(url)
          if parsed.scheme != "https" or not parsed.netloc or "\n" in url or "\r" in url:
              raise SystemExit("Configure the repository secret NUVIO_SUPABASE_URL with the HTTPS production backend.")
          if len(key) < 20 or "\n" in key or "\r" in key:
              raise SystemExit("Configure the repository secret NUVIO_SUPABASE_ANON_KEY with the production publishable key.")
          properties = Path("repos/tv/local.properties")
          if properties.exists():
              raise SystemExit("Refusing to overwrite local.properties in the TV source checkout.")
          properties.write_text(
              f"NUVIO_SUPABASE_URL={url}\nNUVIO_SUPABASE_ANON_KEY={key}\n",
              encoding="utf-8",
          )
          print("Production backend configuration validated and supplied to the TV build.")
          PY

      - name: Configure persistent signing for published TV APKs
        if: steps.release.outputs.action == 'build'
        shell: bash
        env:
          TELUMIA_ANDROID_KEYSTORE_BASE64: ${{ secrets.TELUMIA_ANDROID_KEYSTORE_BASE64 }}
          NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.TELUMIA_ANDROID_KEYSTORE_PASSWORD }}
          NUVIO_RELEASE_KEY_ALIAS: telumia
          NUVIO_RELEASE_KEY_PASSWORD: ${{ secrets.TELUMIA_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${TELUMIA_ANDROID_KEYSTORE_BASE64}" || -z "${NUVIO_RELEASE_STORE_PASSWORD}" || \
                -z "${NUVIO_RELEASE_KEY_PASSWORD}" ]]; then
            echo 'Persistent Android signing is not configured. Set the TELUMIA_ANDROID_KEYSTORE_* and TELUMIA_ANDROID_KEY_* repository secrets before publishing.' >&2
            exit 1
          fi
          keystore_file="${RUNNER_TEMP}/telumia-android-release.jks"
          printf '%s' "${TELUMIA_ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore_file}"
          chmod 600 "${keystore_file}"
          {
            printf 'NUVIO_RELEASE_STORE_FILE=%s\n' "${keystore_file}"
            printf 'NUVIO_RELEASE_KEY_ALIAS=%s\n' "${NUVIO_RELEASE_KEY_ALIAS}"
            printf 'NUVIO_RELEASE_STORE_PASSWORD=%s\n' "${NUVIO_RELEASE_STORE_PASSWORD}"
            printf 'NUVIO_RELEASE_KEY_PASSWORD=%s\n' "${NUVIO_RELEASE_KEY_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Set the generated Android version in the fetched source
        if: steps.release.outputs.action == 'build'
        shell: bash
        env:
          ANDROID_VERSION: ${{ steps.release.outputs.version }}
          ANDROID_VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: |
          set -euo pipefail
          python3 - "repos/tv/app/build.gradle.kts" "${ANDROID_VERSION}" "${ANDROID_VERSION_CODE}" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          version, version_code = sys.argv[2:]
          source = path.read_text(encoding="utf-8")
          source, code_count = re.subn(
              r"(?m)^(\s*versionCode\s*=\s*)\d+(\s*)$",
              lambda match: f"{match.group(1)}{version_code}{match.group(2)}",
              source,
          )
          source, name_count = re.subn(
              r'(?m)^(\s*versionName\s*=\s*)"[^"]+"(\s*)$',
              lambda match: f'{match.group(1)}"{version}"{match.group(2)}',
              source,
          )
          if code_count != 1 or name_count != 1:
              raise SystemExit("Expected exactly one Android versionCode and versionName in defaultConfig.")
          path.write_text(source, encoding="utf-8")
          print(f"Android build version: {version} ({version_code})")
          PY

      - name: Run Live TV unit tests and build all Android TV APKs
        if: steps.release.outputs.action == 'build'
        working-directory: repos/tv
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :app:testFullReleaseUnitTest \
            --tests '*LiveTvGuideCacheTest' \
            --tests '*LiveTvGuideRefreshJobTest' \
            --tests '*LiveTvSourceImporterTest' \
            --tests '*M3uPlaylistParserTest' \
            --tests '*XmlTvParserTest' \
            --tests '*LiveTvChannelStateStoreTest' \
            --tests '*GuideTimelineTest' \
            --tests '*LiveTvQuickChannelPolicyTest' \
            --tests '*LiveTvViewModelTest' \
            --tests '*PhoneRemoteLanAddressTest' \
            --tests '*PhoneRemotePairingAuthorityTest' \
            --tests '*PhoneRemoteServerTest' \
            --tests '*ForkIdentityTest' \
            :app:assembleFullRelease \
            --no-daemon \
            --stacktrace

      - name: Download and verify the Windows Desktop MSI
        if: steps.release.outputs.action == 'build'
        shell: bash
        run: |
          set -euo pipefail
          desktop_api='https://api.github.com/repos/Pepeu2010/telumia-desktop/releases'
          desktop_tag="${{ steps.desktop_source.outputs.desktop_tag }}"
          curl --fail --silent --show-error --location "${desktop_api}/tags/${desktop_tag}" \
            --output "${RUNNER_TEMP}/telumia-desktop-release.json"

          desktop_release="${RUNNER_TEMP}/telumia-desktop-release.json"
          if [[ "$(jq -r '.draft' "${desktop_release}")" != 'false' ]]; then
            echo "Desktop ${desktop_tag} is a draft and cannot be packaged." >&2
            exit 1
          fi
          asset="$(jq -c '[.assets[] | select(.name == "Telumia-Windows-x64.msi")] | if length == 1 then .[0] else empty end' "${desktop_release}")"
          if [[ -z "${asset}" ]]; then
            echo "Desktop ${desktop_tag} does not contain exactly one Telumia-Windows-x64.msi asset." >&2
            exit 1
          fi

          source_asset="$(jq -c '[.assets[] | select(.name == "Telumia-desktop-source.zip")] | if length == 1 then .[0] else empty end' "${desktop_release}")"
          source_manifest_asset="$(jq -c '[.assets[] | select(.name == "release-manifest.json")] | if length == 1 then .[0] else empty end' "${desktop_release}")"
          if [[ -z "${source_asset}" || -z "${source_manifest_asset}" ]]; then
            echo "Desktop ${desktop_tag} must provide its source archive and release manifest." >&2
            exit 1
          fi

          msi_url="$(jq -r '.browser_download_url' <<<"${asset}")"
          msi_size="$(jq -r '.size' <<<"${asset}")"
          msi_digest="$(jq -r '.digest // empty' <<<"${asset}")"
          source_url="$(jq -r '.browser_download_url' <<<"${source_asset}")"
          source_size="$(jq -r '.size' <<<"${source_asset}")"
          source_digest="$(jq -r '.digest // empty' <<<"${source_asset}")"
          manifest_url="$(jq -r '.browser_download_url' <<<"${source_manifest_asset}")"
          manifest_size="$(jq -r '.size' <<<"${source_manifest_asset}")"
          manifest_digest="$(jq -r '.digest // empty' <<<"${source_manifest_asset}")"
          if [[ ! "${msi_digest}" =~ ^sha256:[0-9a-f]{64}$ || \
                ! "${source_digest}" =~ ^sha256:[0-9a-f]{64}$ || \
                ! "${manifest_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "GitHub did not provide SHA-256 digests for the Desktop release files." >&2
            exit 1
          fi
          android_version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' repos/tv/app/build.gradle.kts | head -n 1)"
          release_dir="artifacts/releases/v${android_version}"
          mkdir -p "${release_dir}"
          msi_version="${desktop_tag#v}"
          msi_name="Telumia-Windows-x64-${msi_version}.msi"
          manifest_path="${RUNNER_TEMP}/telumia-desktop-release-manifest.json"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors "${msi_url}" \
            --output "${release_dir}/${msi_name}"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors "${source_url}" \
            --output "${release_dir}/Telumia-desktop-source.zip"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors "${manifest_url}" \
            --output "${manifest_path}"

          verify_asset() {
            local file="$1" expected_size="$2" expected_digest="$3" actual_size actual_digest
            actual_size="$(stat --format='%s' "${file}")"
            actual_digest="sha256:$(sha256sum "${file}" | awk '{print $1}')"
            if [[ "${actual_size}" != "${expected_size}" || "${actual_digest}" != "${expected_digest}" ]]; then
              echo "Downloaded file does not match its published size or SHA-256: ${file}" >&2
              exit 1
            fi
          }
          verify_asset "${release_dir}/${msi_name}" "${msi_size}" "${msi_digest}"
          verify_asset "${release_dir}/Telumia-desktop-source.zip" "${source_size}" "${source_digest}"
          verify_asset "${manifest_path}" "${manifest_size}" "${manifest_digest}"

          desktop_source_sha="$(jq -r '.sourceCommits.desktop // empty' "${manifest_path}")"
          desktop_installer_version="$(jq -r '.distributions.windows.installerVersion // empty' "${manifest_path}")"
          desktop_inspection_count="$(jq '[.sourceArchiveInspections[] | select(.target == "desktop" and .file == "Telumia-desktop-source.zip")] | length' "${manifest_path}")"
          desktop_inspection_sha="$(jq -r '[.sourceArchiveInspections[] | select(.target == "desktop" and .file == "Telumia-desktop-source.zip")][0].sha256 // empty' "${manifest_path}")"
          desktop_manifest_sha="$(jq -r '[.assets[] | select(.name == "Telumia-Windows-x64.msi")][0].sha256 // empty' "${manifest_path}")"
          desktop_manifest_msi_size="$(jq -r '[.assets[] | select(.name == "Telumia-Windows-x64.msi")][0].bytes // empty' "${manifest_path}")"
          if [[ ! "${desktop_source_sha}" =~ ^[a-f0-9]{40}$ || -z "${desktop_installer_version}" || \
                "${desktop_inspection_count}" != '1' || "${desktop_inspection_sha}" != "${source_digest#sha256:}" || \
                "${desktop_manifest_sha}" != "${msi_digest#sha256:}" || "${desktop_manifest_msi_size}" != "${msi_size}" ]]; then
            echo 'Desktop release manifest disagrees with the verified MSI, source archive or installer metadata.' >&2
            exit 1
          fi
          if [[ "${desktop_source_sha}" != "${{ steps.desktop_source.outputs.desktop_source_sha }}" ]]; then
            echo 'The selected Desktop source changed after release validation.' >&2
            exit 1
          fi

          {
            echo "desktop_version=${msi_version}"
            echo "desktop_installer_version=${desktop_installer_version}"
            echo "desktop_source_sha=${desktop_source_sha}"
            echo "desktop_tag=${desktop_tag}"
            echo "desktop_release_url=$(jq -r '.html_url' "${desktop_release}")"
          } >> "${GITHUB_OUTPUT}"
        id: desktop

      - name: Restore the pinned TV source before archiving
        if: steps.release.outputs.action == 'build'
        shell: bash
        run: git -C repos/tv restore --worktree -- app/build.gradle.kts

      - name: Verify APKs and prepare checksums and release notes
        if: steps.release.outputs.action == 'build'
        shell: bash
        env:
          ANDROID_VERSION: ${{ steps.release.outputs.version }}
          ANDROID_VERSION_CODE: ${{ steps.release.outputs.version_code }}
          ANDROID_SOURCE_SHA: ${{ steps.release.outputs.tv_sha }}
          DESKTOP_VERSION: ${{ steps.desktop.outputs.desktop_version }}
          DESKTOP_INSTALLER_VERSION: ${{ steps.desktop.outputs.desktop_installer_version }}
          DESKTOP_SOURCE_SHA: ${{ steps.desktop.outputs.desktop_source_sha }}
          DESKTOP_TAG: ${{ steps.desktop.outputs.desktop_tag }}
          DESKTOP_RELEASE_URL: ${{ steps.desktop.outputs.desktop_release_url }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          DESKTOP_RELEASE_MANIFEST_PATH: ${{ runner.temp }}/telumia-desktop-release-manifest.json
        run: |
          set -euo pipefail
          apk_dir='repos/tv/app/build/outputs/apk/full/release'
          output_dir="artifacts/releases/${RELEASE_TAG}"
          mkdir -p "${output_dir}"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_root}" ]]; then
            echo 'Android SDK path was not configured by the runner.' >&2
            exit 1
          fi
          apksigner="$(find "${sdk_root}/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          aapt="$(find "${sdk_root}/build-tools" -maxdepth 2 -type f -name aapt -print | sort -V | tail -n 1)"
          if [[ -z "${apksigner}" || -z "${aapt}" ]]; then
            echo 'Android build-tools apksigner or aapt was not found.' >&2
            exit 1
          fi

          abis=(universal arm64-v8a armeabi-v7a x86_64 x86)
          for abi in "${abis[@]}"; do
            source="${apk_dir}/app-full-${abi}-release.apk"
            destination="${output_dir}/Telumia-TV-${ANDROID_VERSION}-${abi}.apk"
            if [[ ! -s "${source}" ]]; then
              echo "Missing APK for ${abi}: ${source}" >&2
              exit 1
            fi
            badging="$("${aapt}" dump badging "${source}" | head -n 1)"
            if [[ "${badging}" != *"package: name='io.github.pepeu2010.telumia.tv'"* || \
                  "${badging}" != *"versionCode='${ANDROID_VERSION_CODE}' versionName='${ANDROID_VERSION}'"* ]]; then
              echo "APK ${abi} does not contain the production application ID and generated version ${ANDROID_VERSION} (${ANDROID_VERSION_CODE})." >&2
              exit 1
            fi
            manifest_tree="$("${aapt}" dump xmltree "${source}" AndroidManifest.xml)"
            if grep -Eiq 'android:debuggable.*(0xffffffff|=true)' <<<"${manifest_tree}"; then
              echo "APK ${abi} is debuggable and cannot be published as a stable package." >&2
              exit 1
            fi
            "${apksigner}" verify --verbose "${source}"
            cp "${source}" "${destination}"
          done

          pwsh -NoProfile -File scripts/Export-TelumiaSourceArchive.ps1 \
            -Target tv \
            -Commit "${ANDROID_SOURCE_SHA}" \
            -OutputPath "${output_dir}/Telumia-tv-source.zip"

          apk_count="$(find "${output_dir}" -maxdepth 1 -type f -name '*.apk' | wc -l)"
          msi_count="$(find "${output_dir}" -maxdepth 1 -type f -name '*.msi' | wc -l)"
          zip_count="$(find "${output_dir}" -maxdepth 1 -type f -name '*.zip' | wc -l)"
          if [[ "${apk_count}" -ne 5 || "${msi_count}" -ne 1 || "${zip_count}" -ne 2 ]]; then
            echo "Release must contain five APKs, one MSI and two source archives; found ${apk_count}, ${msi_count} and ${zip_count}." >&2
            exit 1
          fi

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          directory = Path("artifacts/releases") / os.environ["RELEASE_TAG"]
          assets = []
          for path in sorted(directory.iterdir()):
              if path.suffix.lower() not in {".apk", ".msi", ".zip"}:
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assets.append({"name": path.name, "bytes": path.stat().st_size, "sha256": digest})

          desktop_manifest = json.loads(Path(os.environ["DESKTOP_RELEASE_MANIFEST_PATH"]).read_text(encoding="utf-8"))
          desktop_source_inspection = next(
              item for item in desktop_manifest["sourceArchiveInspections"] if item["target"] == "desktop"
          )
          tv_source_inspection = json.loads(
              (directory / "Telumia-tv-source.zip.inspection.json").read_text(encoding="utf-8-sig")
          )
          manifest = {
              "preparedAtUtc": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
              "tag": os.environ["RELEASE_TAG"],
              "product": "Telumia",
              "prerelease": "-" in os.environ["ANDROID_VERSION"] or "-" in os.environ["DESKTOP_TAG"],
              "sourceCommits": {
                  "desktop": os.environ["DESKTOP_SOURCE_SHA"],
                  "tv": os.environ["ANDROID_SOURCE_SHA"],
              },
              "distributions": {
                  "android": {
                      "distribution": "Full production sideload APKs signed with persistent CI release key",
                      "versionCode": os.environ["ANDROID_VERSION_CODE"],
                      "versionName": os.environ["ANDROID_VERSION"],
                      "versioningStrategy": "generated from the latest published Android release when either platform source changes",
                  },
                  "windows": {
                      "installerVersion": os.environ["DESKTOP_INSTALLER_VERSION"],
                      "displayVersion": os.environ["ANDROID_VERSION"],
                      "sourceReleaseTag": os.environ["DESKTOP_TAG"],
                      "sourceReleaseUrl": os.environ["DESKTOP_RELEASE_URL"],
                  },
              },
              "scope": "Android TV fullRelease production APKs built from the selected TV source commit; Windows x64 MSI copied from the selected Desktop release.",
              "validationLabel": "platform-release-workflow",
              "runtimeGates": None,
              "assets": assets,
              "sourceArchiveInspections": [desktop_source_inspection, tv_source_inspection],
          }
          if manifest["distributions"]["android"]["versionName"] != os.environ["ANDROID_VERSION"]:
              raise SystemExit("Production Android release manifest version mismatch.")
          (directory / "release-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          (cd "${output_dir}" && sha256sum ./*.apk ./*.msi ./*.zip ./release-manifest.json > SHA256SUMS.txt)
          cat > release-notes.md <<EOF
          ## Telumia ${ANDROID_VERSION} — Android TV/TV Box e Windows PC

          Esta release reúne os pacotes Android TV e Windows PC na página principal da Telumia.

          **Android TV/TV Box ${ANDROID_VERSION}** (código ${ANDROID_VERSION_CODE}): APK de produção universal e variantes ARM64, ARM32, x86_64 e x86. A versão de instalação é incrementada automaticamente quando a automação identifica uma nova fonte de TV ou Windows; o código-fonte exato permanece no arquivo da fonte. Fonte TV: [${ANDROID_SOURCE_SHA}](https://github.com/Pepeu2010/telumia-tv/commit/${ANDROID_SOURCE_SHA}). Os APKs usam uma chave persistente de assinatura do CI para permitir atualizações entre releases futuras. A instalação v1.0.0 assinada com outro certificado exige uma migração inicial; preserve os dados locais antes de remover o APK antigo. Telumia-tv-source.zip contém o código-fonte TV desse commit.

          **Windows PC ${DESKTOP_VERSION}** (ProductVersion ${DESKTOP_INSTALLER_VERSION}): MSI x64 copiado da [release Desktop ${DESKTOP_TAG}](${DESKTOP_RELEASE_URL}). A versão de PC é identificada separadamente da versão Android. Telumia-desktop-source.zip corresponde à mesma release Desktop.

          SHA256SUMS.txt cobre os cinco APKs, o MSI, os dois arquivos de fonte e o manifesto desta release.
          EOF

      - name: Preserve the built packages in the workflow run
        if: steps.release.outputs.action == 'build'
        uses: actions/upload-artifact@v7
        with:
          name: telumia-${{ steps.release.outputs.version }}-android-tv-windows-pc
          path: |
            artifacts/releases/${{ steps.release.outputs.tag }}/*.apk
            artifacts/releases/${{ steps.release.outputs.tag }}/*.msi
            artifacts/releases/${{ steps.release.outputs.tag }}/*.zip
            artifacts/releases/${{ steps.release.outputs.tag }}/release-manifest.json
            artifacts/releases/${{ steps.release.outputs.tag }}/SHA256SUMS.txt
            release-notes.md
          if-no-files-found: error
          retention-days: 30

      - name: Create a draft release in the main Telumia repository
        if: steps.release.outputs.action == 'build' && env.RELEASE_MODE == 'publish'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
          DESKTOP_VERSION: ${{ steps.desktop.outputs.desktop_version }}
        run: |
          set -euo pipefail
          release_dir="artifacts/releases/${RELEASE_TAG}"
          arguments=(release create "${RELEASE_TAG}" "${release_dir}"/*.apk "${release_dir}"/*.msi \
            "${release_dir}"/*.zip "${release_dir}/release-manifest.json" "${release_dir}/SHA256SUMS.txt" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Telumia ${RELEASE_VERSION} — Android TV + Windows PC" \
            --notes-file release-notes.md \
            --draft \
            --latest=false)
          if [[ "${RELEASE_IS_PRERELEASE}" == 'true' ]]; then
            arguments+=(--prerelease)
          fi
          gh "${arguments[@]}"

          release_json="${RUNNER_TEMP}/telumia-draft-release.json"
          release_list="${RUNNER_TEMP}/telumia-created-releases.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "${release_list}"
          matching_count="$(jq --arg tag "${RELEASE_TAG}" '[.[] | select(.tag_name == $tag and .draft == true)] | length' "${release_list}")"
          if [[ "${matching_count}" != '1' ]]; then
            echo "Could not find exactly one draft release for ${RELEASE_TAG} after upload." >&2
            exit 1
          fi
          jq -c --arg tag "${RELEASE_TAG}" '[.[] | select(.tag_name == $tag and .draft == true)][0]' \
            "${release_list}" > "${release_json}"
          expected_prerelease=false
          if [[ "${RELEASE_IS_PRERELEASE}" == 'true' ]]; then
            expected_prerelease=true
          fi
          if [[ "$(jq -r '.draft' "${release_json}")" != 'true' || \
                "$(jq -r '.prerelease' "${release_json}")" != "${expected_prerelease}" ]]; then
            echo 'The uploaded release has the wrong draft or prerelease state.' >&2
            exit 1
          fi

          expected_names="$(find "${release_dir}" -maxdepth 1 -type f \( -name '*.apk' -o -name '*.msi' -o -name '*.zip' -o -name 'release-manifest.json' -o -name 'SHA256SUMS.txt' \) -printf '%f\n' | sort)"
          actual_names="$(jq -r '.assets[].name' "${release_json}" | sort)"
          if [[ "${expected_names}" != "${actual_names}" ]]; then
            echo 'The draft release asset list differs from the validated package set.' >&2
            diff -u <(printf '%s\n' "${expected_names}") <(printf '%s\n' "${actual_names}") >&2 || true
            exit 1
          fi
          while IFS= read -r name; do
            file="${release_dir}/${name}"
            expected_size="$(stat --format='%s' "${file}")"
            expected_digest="sha256:$(sha256sum "${file}" | awk '{print $1}')"
            remote="$(jq -c --arg name "${name}" '.assets[] | select(.name == $name)' "${release_json}")"
            if [[ "$(jq -r '.state' <<<"${remote}")" != 'uploaded' || \
                  "$(jq -r '.size' <<<"${remote}")" != "${expected_size}" || \
                  "$(jq -r '.digest' <<<"${remote}")" != "${expected_digest}" ]]; then
              echo "The GitHub upload failed verification for ${name}." >&2
              exit 1
            fi
          done <<< "${expected_names}"

          release_id="$(jq -r '.id' "${release_json}")"
          if [[ "${RELEASE_IS_PRERELEASE}" == 'true' ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -F draft=false -F prerelease=true --silent
          else
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -F draft=false -F prerelease=false -f make_latest=true --silent
          fi

          final_release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"
          if [[ "$(jq -r '.draft' <<<"${final_release}")" != 'false' || \
                "$(jq -r '.tag_name' <<<"${final_release}")" != "${RELEASE_TAG}" ]]; then
            echo 'The release was not published against its intended tag.' >&2
            exit 1
          fi
          jq -r '"Published " + .html_url' <<<"${final_release}"

      - name: Verify and publish an uploaded release draft
        if: steps.release.outputs.action == 'resume_draft'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.draft_id }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
          ANDROID_VERSION_CODE: ${{ steps.release.outputs.version_code }}
          ANDROID_SOURCE_SHA: ${{ steps.release.outputs.tv_sha }}
          DESKTOP_SOURCE_SHA: ${{ steps.release.outputs.desktop_sha }}
          DESKTOP_TAG_SELECTED: ${{ steps.desktop_source.outputs.desktop_tag }}
          DESKTOP_VERSION_INPUT: ${{ github.event.inputs.desktop_version || '' }}
        run: |
          set -euo pipefail
          release_json="${RUNNER_TEMP}/telumia-existing-draft.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > "${release_json}"
          expected_prerelease=false
          if [[ "${RELEASE_IS_PRERELEASE}" == 'true' ]]; then
            expected_prerelease=true
          fi
          if [[ "$(jq -r '.draft' "${release_json}")" != 'true' || \
                "$(jq -r '.tag_name' "${release_json}")" != "${RELEASE_TAG}" || \
                "$(jq -r '.prerelease' "${release_json}")" != "${expected_prerelease}" ]]; then
            echo 'The existing release draft has the wrong tag or publication state.' >&2
            exit 1
          fi

          apk_count="$(jq '[.assets[] | select(.name | endswith(".apk"))] | length' "${release_json}")"
          msi_count="$(jq '[.assets[] | select(.name | endswith(".msi"))] | length' "${release_json}")"
          zip_count="$(jq '[.assets[] | select(.name | endswith(".zip"))] | length' "${release_json}")"
          manifest_asset="$(jq -c '[.assets[] | select(.name == "release-manifest.json")] | if length == 1 then .[0] else empty end' "${release_json}")"
          sums_asset="$(jq -c '[.assets[] | select(.name == "SHA256SUMS.txt")] | if length == 1 then .[0] else empty end' "${release_json}")"
          if (( apk_count != 5 || msi_count != 1 || zip_count != 2 )) || [[ -z "${manifest_asset}" || -z "${sums_asset}" ]]; then
            echo 'The uploaded release draft does not contain the required ten assets.' >&2
            exit 1
          fi

          manifest_path="${RUNNER_TEMP}/telumia-existing-release-manifest.json"
          sums_path="${RUNNER_TEMP}/telumia-existing-SHA256SUMS.txt"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/octet-stream' \
            "$(jq -r '.url' <<<"${manifest_asset}")" --output "${manifest_path}"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/octet-stream' \
            "$(jq -r '.url' <<<"${sums_asset}")" --output "${sums_path}"

          python3 - "${release_json}" "${manifest_path}" "${sums_path}" \
            "${RELEASE_TAG}" "${RELEASE_VERSION}" "${ANDROID_VERSION_CODE}" "${ANDROID_SOURCE_SHA}" "${DESKTOP_VERSION_INPUT}" \
            "${DESKTOP_SOURCE_SHA}" "${DESKTOP_TAG_SELECTED}" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          release_path, manifest_path, sums_path, tag, version, version_code, tv_sha, desktop_input, desktop_sha, selected_desktop_tag = sys.argv[1:]
          release = json.loads(Path(release_path).read_text(encoding="utf-8"))
          manifest_bytes = Path(manifest_path).read_bytes()
          sums_bytes = Path(sums_path).read_bytes()
          manifest_asset = next(asset for asset in release["assets"] if asset["name"] == "release-manifest.json")
          sums_asset = next(asset for asset in release["assets"] if asset["name"] == "SHA256SUMS.txt")
          for asset, content in ((manifest_asset, manifest_bytes), (sums_asset, sums_bytes)):
              if asset.get("state") != "uploaded" or asset.get("digest") != "sha256:" + hashlib.sha256(content).hexdigest() or asset["size"] != len(content):
                  raise SystemExit(f"Downloaded {asset['name']} differs from GitHub's uploaded asset metadata.")

          manifest = json.loads(manifest_bytes)
          android_manifest = manifest.get("distributions", {}).get("android", {})
          if manifest.get("tag") != tag or android_manifest.get("versionName") != version or str(android_manifest.get("versionCode")) != version_code:
              raise SystemExit("The release manifest does not match the selected Android tag and version.")
          if manifest.get("sourceCommits", {}).get("tv") != tv_sha:
              raise SystemExit("The release manifest points to a different Android TV source commit.")
          desktop_tag = manifest.get("distributions", {}).get("windows", {}).get("sourceReleaseTag", "")
          if manifest.get("sourceCommits", {}).get("desktop") != desktop_sha:
              raise SystemExit("The release manifest points to a different Windows Desktop source commit.")
          if desktop_tag != selected_desktop_tag:
              raise SystemExit("The release draft does not match the selected Desktop release.")
          if desktop_input and desktop_tag != "v" + desktop_input.removeprefix("v"):
              raise SystemExit("The existing draft does not match the requested Desktop release.")

          remote_assets = {asset["name"]: asset for asset in release["assets"]}
          if len(remote_assets) != 10:
              raise SystemExit("The release draft contains duplicate or unexpected assets.")
          package_records = manifest.get("assets", [])
          if len(package_records) != 8:
              raise SystemExit("The release manifest must list five APKs, one MSI and two source archives.")
          for record in package_records:
              asset = remote_assets.get(record["name"])
              if asset is None or asset.get("state") != "uploaded" or asset.get("size") != record["bytes"] or asset.get("digest") != "sha256:" + record["sha256"]:
                  raise SystemExit(f"Uploaded asset does not match its release manifest: {record['name']}")
          if sum(name.endswith(".apk") for name in remote_assets) != 5 or sum(name.endswith(".msi") for name in remote_assets) != 1 or sum(name.endswith(".zip") for name in remote_assets) != 2:
              raise SystemExit("The release draft does not contain the expected APK, MSI and source archive set.")

          sums = {}
          for line in sums_bytes.decode("utf-8").splitlines():
              digest, filename = line.split(None, 1)
              filename = filename.lstrip("*").removeprefix("./")
              if filename in sums:
                  raise SystemExit(f"Duplicate checksum entry: {filename}")
              sums[filename] = digest
          expected_sums = set(remote_assets) - {"SHA256SUMS.txt"}
          if set(sums) != expected_sums:
              raise SystemExit("SHA256SUMS.txt does not list every release asset except itself.")
          for name, digest in sums.items():
              if remote_assets[name].get("digest") != "sha256:" + digest:
                  raise SystemExit(f"Checksum file disagrees with the GitHub asset digest: {name}")
          PY

          if [[ "${expected_prerelease}" == 'true' ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              -F draft=false -F prerelease=true --silent
          else
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              -F draft=false -F prerelease=false -f make_latest=true --silent
          fi

          final_release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          if [[ "$(jq -r '.draft' <<<"${final_release}")" != 'false' || \
                "$(jq -r '.tag_name' <<<"${final_release}")" != "${RELEASE_TAG}" ]]; then
            echo 'The existing draft did not publish against its intended tag.' >&2
            exit 1
          fi
          jq -r '"Published " + .html_url' <<<"${final_release}"

      - name: Summarize build-only result
        if: steps.release.outputs.action == 'build' && env.RELEASE_MODE == 'build-only'
        run: echo 'Packages were built, verified, and saved as a 30-day workflow artifact; no release was published.'
